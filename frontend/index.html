<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Hub - Cổng Đăng Nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper" id="login-form">
            <h2>Đăng Nhập</h2>
            <form id="login">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Mật khẩu" required>
                <button type="submit">Đăng Nhập</button>
            </form>
            <p>Chưa có tài khoản? <span class="toggle-link" onclick="toggleForm('register-form')">Đăng ký ngay</span></p>
            <p><span class="toggle-link" onclick="toggleForm('forgot-form')">Quên mật khẩu?</span></p>
        </div>

        <div class="form-wrapper hidden" id="register-form">
            <h2>Đăng Ký</h2>
            <form id="register">
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Mật khẩu" required>
                <button type="submit">Đăng Ký & Nhận OTP</button>
            </form>
            <p>Đã có tài khoản? <span class="toggle-link" onclick="toggleForm('login-form')">Đăng nhập</span></p>
        </div>

        <div class="form-wrapper hidden" id="forgot-form">
            <h2>Quên Mật Khẩu</h2>
            <form id="forgot">
                <input type="email" id="forgot-email" placeholder="Nhập email của bạn" required>
                <button type="submit">Gửi Mã OTP</button>
            </form>
            <p>Quay lại <span class="toggle-link" onclick="toggleForm('login-form')">Đăng nhập</span></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
